<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hub{% endblock %} · NATRA®</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anta&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

    {% block nav %}
    <header class="topbar">
        <div class="topbar-inner">
            <a href="{{ url_for('landing') }}" class="brand">
                <span class="brand-mark">◆</span> NATRA<span class="brand-reg">®</span>
            </a>
            <nav class="topnav">
                {% if current_user %}
                    <a href="{{ url_for('dashboard') }}">Dashboard</a>
                    <a href="{{ url_for('projects') }}">Projects</a>
                    <a href="{{ url_for('tasks') }}">Tasks</a>
                    <span class="nav-user">{{ current_user['name'] }}</span>
                    <a href="{{ url_for('logout') }}" class="btn-ghost">Log out</a>
                {% else %}
                    <a href="#features">Features</a>
                    <a href="{{ url_for('login') }}" class="btn-ghost">Log in</a>
                    <a href="{{ url_for('signup') }}" class="btn-primary">Sign up</a>
                {% endif %}
            </nav>
        </div>
    </header>
    {% endblock %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
