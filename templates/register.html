{% extends "base.html" %}
{% block title %}Register — NATRA{% endblock %}
{% block content %}
<div class="page page--narrow">
  <div class="eyebrow">Join the board</div>
  <h2>Register</h2>
  <form class="card" method="post" action="{{ url_for('auth.register') }}">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" required autofocus />
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="8" required />
    </div>
    <button class="btn btn--primary" style="width:100%" type="submit">Create account</button>
  </form>
  <p class="eyebrow" style="margin-top:1rem">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
