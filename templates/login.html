{% extends "base.html" %}
{% block title %}Log in — NATRA{% endblock %}
{% block content %}
<div class="page page--narrow">
  <div class="eyebrow">Welcome back</div>
  <h2>Log in</h2>
  <form class="card" method="post" action="{{ url_for('auth.login') }}">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autofocus />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />
    </div>
    <button class="btn btn--primary" style="width:100%" type="submit">Log in</button>
  </form>
  <p class="eyebrow" style="margin-top:1rem">No account? <a href="{{ url_for('auth.register') }}">Register</a></p>
</div>
{% endblock %}
